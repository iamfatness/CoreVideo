# Cross-platform validation only. This workflow does not build or publish the
# Windows product.
#
# Windows packages are built and published from the maintainer's machine with
# scripts/release-local.ps1 — that is how every release to date was actually
# cut, and the Windows plugin cannot be built here anyway: it needs the
# license-restricted Zoom Meeting SDK. See docs/RELEASE_CHECKLIST.md.
#
# There is no tag trigger and no release job: pushing a v* tag publishes
# nothing from CI. The jobs below (macOS compile validation, Linux/GCC unit
# tests, Companion module tests) need no Zoom SDK and guard portability — the
# Linux/GCC job catches size_t and other 64-bit issues MSVC accepts.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # macOS (arm64) - real plugin bundle + engine scaffold
  build-macos:
    # Builds the ACTUAL obs-zoom-plugin bundle (COREVIDEO_BUILD_PLUGIN=ON) plus
    # the macOS ZoomObsEngine scaffold linked against the real ZoomSDK.framework
    # (COREVIDEO_BUILD_ENGINE=ON when the SDK is fetched). This is arm64-only
    # (host arch on the macos-14 runner) by design - NOT a universal binary and
    # NOT a signed/notarized shippable package yet (see PR for remaining work).
    #
    # The engine is a SCAFFOLD: the macOS Zoom Meeting SDK is Objective-C only,
    # so the shared C++ engine sources cannot compile here. The scaffold links
    # the framework (validating fetch + link) and fails loudly at runtime on any
    # meeting request. See engine/src/main-macos.mm.
    name: macOS arm64 (plugin + engine scaffold)
    runs-on: macos-14
    permissions:
      # DRAFT releases are only visible to a token with write-level (push)
      # access; contents: read cannot enumerate them, so the SDK asset lookup
      # would silently find nothing and the engine would fall back to OFF.
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake qt@6

      # Download OBS source archive for headers only.
      # The plugin links with -undefined dynamic_lookup so no libobs is
      # needed at link time; OBS resolves all obs_* symbols at load time.
      - name: Get OBS headers
        run: |
          OBS_VER=32.2.2
          curl -fL \
              "https://github.com/obsproject/obs-studio/archive/refs/tags/${OBS_VER}.tar.gz" \
              -o obs-source.tar.gz
          mkdir -p /tmp/obs-source
          tar -xzf obs-source.tar.gz --strip-components=1 \
              -C /tmp/obs-source \
              "obs-studio-${OBS_VER}/libobs" \
              "obs-studio-${OBS_VER}/frontend/api"

          mkdir -p /tmp/obs-sdk/include/obs \
                   /tmp/obs-sdk/cmake/LibObs \
                   /tmp/obs-sdk/cmake/obs-frontend-api

          cp -R /tmp/obs-source/libobs/*                            /tmp/obs-sdk/include/obs/
          cp /tmp/obs-source/frontend/api/obs-frontend-api.h /tmp/obs-sdk/include/obs/

          # OBS 31+ removed the vendored simde tree (util/sse-intrin.h needs
          # it on ARM; it now ships via obs-deps prebuilts) and obs-config.h
          # includes the build-generated obsconfig.h unconditionally. Stage
          # header-only simde and synthesize a minimal obsconfig.h -- the
          # values are irrelevant to a plugin, they only have to resolve.
          SIMDE_VER=0.8.2
          curl -fL \
              "https://github.com/simd-everywhere/simde/archive/refs/tags/v${SIMDE_VER}.tar.gz" \
              -o simde.tar.gz
          mkdir -p /tmp/simde-src
          tar -xzf simde.tar.gz --strip-components=1 -C /tmp/simde-src
          cp -R /tmp/simde-src/simde /tmp/obs-sdk/include/

          printf '%s\n' \
              '#pragma once' \
              '#define OBS_VERSION "32.2.2"' \
              '#define OBS_VERSION_CANONICAL "32.2.2"' \
              '#define OBS_DATA_PATH "data"' \
              '#define OBS_INSTALL_PREFIX "/usr/local"' \
              '#define OBS_PLUGIN_DESTINATION "obs-plugins"' \
              '#define OBS_QT_VERSION 6' \
              '#define OBS_RELEASE_CANDIDATE 0' \
              '#define OBS_BETA 0' \
              > /tmp/obs-sdk/include/obs/obsconfig.h

          # Write cmake config files using printf (avoids heredoc quoting issues).
          printf '%s\n' \
              'add_library(OBS::libobs INTERFACE IMPORTED GLOBAL)' \
              'set_target_properties(OBS::libobs PROPERTIES' \
              '    INTERFACE_INCLUDE_DIRECTORIES "/tmp/obs-sdk/include/obs;/tmp/obs-sdk/include")' \
              'set(LibObs_FOUND TRUE)' \
              > /tmp/obs-sdk/cmake/LibObs/LibObsConfig.cmake

          printf '%s\n' \
              'add_library(OBS::obs-frontend-api INTERFACE IMPORTED GLOBAL)' \
              'set_target_properties(OBS::obs-frontend-api PROPERTIES' \
              '    INTERFACE_INCLUDE_DIRECTORIES "/tmp/obs-sdk/include/obs")' \
              'set(obs-frontend-api_FOUND TRUE)' \
              > /tmp/obs-sdk/cmake/obs-frontend-api/obs-frontend-apiConfig.cmake

          echo "=== LibObsConfig.cmake ==="
          cat /tmp/obs-sdk/cmake/LibObs/LibObsConfig.cmake
          echo "=== obs-frontend-apiConfig.cmake ==="
          cat /tmp/obs-sdk/cmake/obs-frontend-api/obs-frontend-apiConfig.cmake

      # The macOS Zoom Meeting SDK is stored as a private draft-release asset.
      # Draft releases are invisible to the public but visible to the workflow's
      # own GITHUB_TOKEN; the asset bytes are downloadable via the asset API with
      # `Accept: application/octet-stream`. `gh api` handles the S3 redirect and
      # strips the Authorization header on the redirect hop for us. Never commit
      # the SDK; never publish this draft release.
      - name: Download Zoom macOS SDK (private draft-release asset)
        id: zoom_sdk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_name="zoom-sdk-macos-7.1.5.84750.zip"
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.draft) | .assets[] | select(.name==\"${asset_name}\") | .id" \
              | head -1)"
          if [ -z "${asset_id}" ]; then
              echo "::warning::${asset_name} not found on any draft release; building plugin only (engine OFF)."
              echo "has_zoom_sdk=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          echo "Fetching ${asset_name} (asset id ${asset_id})"
          gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > zoom-sdk.zip
          echo "Downloaded $(du -h zoom-sdk.zip | cut -f1)"
          mkdir -p third_party/zoom-sdk-extracted
          unzip -q zoom-sdk.zip -d third_party/zoom-sdk-extracted
          # Archive layout: <root>/ZoomSDK/ZoomSDK.framework + sibling frameworks.
          sdk_root="$(find third_party/zoom-sdk-extracted -maxdepth 3 -type d -name ZoomSDK \
              -exec test -d '{}/ZoomSDK.framework' ';' -print | head -1)"
          if [ -z "${sdk_root}" ]; then
              echo "::error::Could not locate ZoomSDK/ZoomSDK.framework in the SDK archive."
              find third_party/zoom-sdk-extracted -maxdepth 3 -type d | head -40
              exit 1
          fi
          rm -rf third_party/zoom-sdk
          mv "${sdk_root}" third_party/zoom-sdk
          rm -rf third_party/zoom-sdk-extracted zoom-sdk.zip
          echo "ZoomSDK.framework present:"
          ls -la third_party/zoom-sdk/ZoomSDK.framework | head
          echo "has_zoom_sdk=true" >> "$GITHUB_OUTPUT"

      - name: Configure
        # COREVIDEO_BUILD_PLUGIN=ON builds the real obs-zoom-plugin bundle + the
        # macOS OAuth callback helper. The plugin links OBS symbols lazily
        # (-undefined dynamic_lookup), so only OBS headers + Qt6 are needed at
        # build time. COREVIDEO_BUILD_ENGINE is ON only when the Zoom SDK was
        # fetched above (otherwise there is no framework to link the engine
        # scaffold against).
        run: |
          QT_PREFIX="$(brew --prefix qt@6)"
          HOST_ARCH="$(uname -m)"
          BUILD_ENGINE="${{ steps.zoom_sdk.outputs.has_zoom_sdk == 'true' && 'ON' || 'OFF' }}"
          echo "Building engine scaffold: ${BUILD_ENGINE}"
          cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$HOST_ARCH" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DCOREVIDEO_BUILD_PLUGIN=ON \
              -DCOREVIDEO_BUILD_ENGINE="$BUILD_ENGINE" \
              -DZOOM_SDK_DIR=third_party/zoom-sdk \
              "-DCMAKE_PREFIX_PATH=/tmp/obs-sdk;$QT_PREFIX" \
              "-DLibObs_DIR=/tmp/obs-sdk/cmake/LibObs" \
              "-Dobs-frontend-api_DIR=/tmp/obs-sdk/cmake/obs-frontend-api" \
              "-DZOOM_EMBED_SDK_KEY=${{ secrets.ZOOM_EMBED_SDK_KEY }}" \
              "-DZOOM_EMBED_SDK_SECRET=${{ secrets.ZOOM_EMBED_SDK_SECRET }}" \
              "-DZOOM_EMBED_JWT_TOKEN=${{ secrets.ZOOM_EMBED_JWT_TOKEN }}" \
              "-DZOOM_EMBED_OAUTH_CLIENT_ID=y6sIWSwiTZe1JygMx4C9EQ" \
              "-DZOOM_EMBED_OAUTH_AUTHORIZATION_URL=${{ secrets.ZOOM_EMBED_OAUTH_AUTHORIZATION_URL }}" \
              "-DZOOM_EMBED_MEETING_SDK_PUBLIC_APP_KEY=y6sIWSwiTZe1JygMx4C9EQ"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package as ZIP
        # Compile/link-validation artifact for the macOS port. It contains the
        # real plugin bundle, OAuth helper, and (when built) the engine
        # SCAFFOLD - which is NOT a functional Zoom engine (see
        # engine/src/main-macos.mm). arm64-only; unsigned/un-notarized; not a
        # universal binary; NOT attached to GitHub Releases. The name marks it
        # "unsigned-arm64" so nobody mistakes it for an installable package.
        run: |
          cmake --install build --prefix install
          ARCH="$(uname -m)"
          cd install && zip -r "../CoreVideo-macOS-${ARCH}-unsigned.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CoreVideo-macOS-compile-validation
          path: CoreVideo-macOS-*-unsigned.zip
          if-no-files-found: warn

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: CoreVideo-macOS-build-logs
          path: build/
          if-no-files-found: ignore

  # Linux (cross-platform code + unit tests)
  #
  # Linux has no shippable CoreVideo artifact: the plugin and engine both
  # depend on the Zoom SDK / OBS+Qt runtime and are not packaged for Linux.
  # This job exists to compile the cross-platform C++ and run the standalone
  # unit tests (BUILD_TESTING) on a second toolchain (GCC), catching
  # portability regressions that the MSVC/AppleClang jobs miss.
  #
  # The plugin, engine and sidecar are kept OFF: plugin/engine require the
  # Zoom SDK, and the sidecar needs a full Qt6 GUI/OBS dependency stack whose
  # GUI smoke test (CoreVideoSidecar --version) is brittle on a headless
  # runner. The standalone tests need only a C++ compiler and the headers in
  # src/, so this job is fast and reliable.
  build-linux:
    name: Linux Tests (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCOREVIDEO_BUILD_PLUGIN=OFF \
              -DCOREVIDEO_BUILD_ENGINE=OFF \
              -DCOREVIDEO_BUILD_SIDECAR=OFF \
              -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: CoreVideo-Linux-build-logs
          path: build/
          if-no-files-found: ignore

  # Companion module (TypeScript) unit tests
  #
  # Lightweight Node job that type-checks the build and runs the vitest unit
  # tests for the Bitfocus Companion module's pure logic (state/variable
  # mapping). Uses `npm install` rather than `npm ci` because the module does
  # not commit a package-lock.json.
  companion-tests:
    name: Companion Module Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: companion/companion-module-corevideo-obs
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (type check)
        run: npm run build

      - name: Test
        run: npm test
