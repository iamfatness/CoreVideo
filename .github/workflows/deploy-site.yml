name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wiki/**"
      - "site-assets/**"
      - "scripts/build-site.mjs"
      - "public/**"
      - "site-worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy corevideo.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build static site
        run: node scripts/build-site.mjs

      - name: Validate Cloudflare configuration
        id: cloudflare_config
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            {
              echo "Cloudflare deploy skipped."
              echo
              echo "Set CLOUDFLARE_API_TOKEN as a repository secret and"
              echo "CLOUDFLARE_ACCOUNT_ID as either a repository secret or variable"
              echo "to enable deployment to corevideo.io."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare_config.outputs.deploy_enabled == 'true'
        run: npx wrangler@latest deploy

      # Purge the edge cache so a new deploy is served immediately instead of
      # leaving a stale-cache window. Non-fatal: if the API token lacks
      # Zone:Read / Cache Purge, this warns and the deploy still succeeds.
      - name: Purge Cloudflare cache
        if: steps.cloudflare_config.outputs.deploy_enabled == 'true'
        shell: bash
        run: |
          for zone in corevideo.io iamfatness.us; do
            zid=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones?name=$zone&status=active" \
              | python3 -c "import sys,json; r=(json.load(sys.stdin).get('result') or []); print(r[0]['id'] if r else '')")
            if [ -z "$zid" ]; then
              echo "::warning::No zone id for $zone (token may lack Zone:Read); skipped purge."
              continue
            fi
            resp=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$zid/purge_cache" \
              --data '{"purge_everything":true}')
            ok=$(printf '%s' "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success'))" 2>/dev/null)
            if [ "$ok" = "True" ]; then echo "Purged cache for $zone"; else echo "::warning::Cache purge failed for $zone: $resp"; fi
          done
